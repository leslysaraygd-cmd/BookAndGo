<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explorar destinos · Book&Go IA</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--side:#0b1020;--ink:#111827;--muted:#6b7280;--bg:#f8fafc;--card:#fff;--brand:#7c5cff;--brand2:#a855f7;--line:#e5e7eb;--chip:#e0edff;--chipt:#1d4ed8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f1f5f9;--muted:#9ca3af;--bg:#0f172a;--card:#1e293b;--line:#334155;--chip:#1e3a8a;--chipt:#bfdbfe;color-scheme:dark}}
*{box-sizing:border-box}
svg.lucide{width:18px;height:18px;vertical-align:-3px;stroke-width:2}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:277px;background:var(--side);color:#cbd5e1;padding:20px 19px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.logo{font-size:26px;font-weight:700;color:#fff;margin:6px 0 16px}.logo b{color:#4f8cff}
aside a{display:block;padding:11px 20px;border-radius:12px;color:#cbd5e1;text-decoration:none;cursor:pointer}
aside a.on,aside a:hover{background:#1c2438;color:#fff}
.promo{margin-top:auto;background:linear-gradient(160deg,#2e1065,#1e1b4b);border-radius:18px;padding:20px;text-align:center;color:#fff}
.promo p{font-size:14px;color:#cbd5e1;margin:6px 0 12px}
.btn{border:0;border-radius:999px;padding:12px 28px;color:#fff;font:inherit;font-size:16px;cursor:pointer;background:linear-gradient(90deg,var(--brand),var(--brand2));text-decoration:none;display:inline-block;text-align:center}
main{flex:1;min-width:0}
.hero{padding:48px 60px 64px;color:#fff;background:linear-gradient(180deg,#0b1020aa,#0b102066),url("banner.jpg") center/cover no-repeat}
.hero h1{font-size:46px;line-height:1.1;margin:0 0 14px}.hero h1 span{color:#a78bfa}
.hero p{max-width:640px;opacity:.9;font-size:18px;margin:0}
.chip{display:inline-block;background:var(--chip);color:var(--chipt);font-size:13px;padding:6px 18px;border-radius:99px;margin-bottom:16px}
section{padding:40px 60px 100px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.filters button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 18px;font:inherit;font-size:14px;cursor:pointer;text-transform:capitalize}
.filters button.on{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.ecard{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 4px 14px #0001;display:flex;flex-direction:column;transition:.2s}.ecard:hover{transform:translateY(-4px);box-shadow:0 12px 28px #0002}
.eim{height:170px;position:relative;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:44px}.eim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.eim b{position:absolute;right:10px;top:10px;z-index:1;background:#000a;color:#fff;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600}
.ebd{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}.ecard h4{margin:0;font-size:19px}.ecard p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.tg{display:flex;gap:6px;flex-wrap:wrap}.tg span{background:var(--chip);color:var(--chipt);font-size:12px;padding:3px 10px;border-radius:99px;text-transform:capitalize}
.ecard .btn{margin-top:auto;width:100%;padding:11px 16px;font-size:15px}
@media(max-width:860px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px}.logo{margin:0 auto 0 0;font-size:22px}.promo{display:none}.hero{padding:32px 22px 44px}.hero h1{font-size:34px}section{padding:28px 22px 80px}}
</style>
</head>
<body>
<aside>
  <div class="logo"><i data-lucide="compass" style="width:28px;height:28px;color:#4f8cff"></i> Book&amp;Go <b>IA</b></div>
  <a href="index.html"><i data-lucide="home"></i> Inicio</a>
  <a class="on" href="explorar.html"><i data-lucide="compass"></i> Explorar</a>
  <div class="promo">
    <b>Planifica mejor con nuestra IA</b>
    <p>Recibe recomendaciones personalizadas y vive experiencias únicas.</p>
    <a class="btn" href="index.html">Volver al inicio</a>
  </div>
</aside>
<main>
  <div class="hero">
    <span class="chip">EXPLORAR</span>
    <h1>Destinos <span>recomendados</span> para ti</h1>
    <p>Elige uno y Book&amp;Go IA te lleva directo a reservarlo, sin volver a escribir nada.</p>
  </div>
  <section>
    <div class="filters" id="filters"></div>
    <div class="egrid" id="egrid"></div>
  </section>
</main>
<script>
// [id, nombre, etiquetas, costo por día (MXN), título de Wikipedia para la foto, descripción]. Los id coinciden con los de chat.js.
const D=[
["pv","Puerto Vallarta","playa romantico tranquilo",1800,"Puerto_Vallarta","Playas, malecón y atardeceres frente al Pacífico. Ideal para una escapada en pareja."],
["cun","Cancún","playa familia aventura",2200,"Cancún","Mar turquesa, parques y vida nocturna. Perfecto para ir en familia o con amigos."],
["oax","Oaxaca","cultura gastronomia tranquilo",1300,"Oaxaca_de_Juárez","Mercados, mezcal y tradición viva. Un viaje para comer, caminar y descubrir cultura."],
["sc","San Cristóbal","cultura aventura tranquilo",1100,"San_Cristóbal_de_las_Casas","Pueblo mágico entre montañas, cafés y artesanías. Muy tranquilo y lleno de aventura."],
["gto","Guanajuato","cultura romantico tranquilo",1200,"Guanajuato_(Guanajuato)","Callejones de colores, túneles y leyendas. Una ciudad romántica y fácil de recorrer a pie."],
["tul","Tulum","playa romantico aventura",2400,"Tulum","Ruinas frente al mar, cenotes y hoteles boutique. Naturaleza y relax en el Caribe."],
["bac","Bacalar","tranquilo romantico playa",1500,"Bacalar","La laguna de los siete colores. Calma total para desconectarte y navegar en kayak."],
["cdmx","Ciudad de México","cultura gastronomia familia",1500,"Ciudad_de_México","Museos, tacos y barrios con historia. Siempre hay un plan nuevo por descubrir."],
["mty","Monterrey","aventura familia",1600,"Monterrey","Montañas, parques y buena comida norteña. Aventura urbana para toda la familia."],
["lap","La Paz","playa tranquilo aventura",1700,"La_Paz_(Baja_California_Sur)","Aguas tranquilas, lobos marinos y playas casi vacías. Una joya de Baja California Sur."]
].map(([id,n,t,c,k,d])=>({id,n,t,c,k,d}));
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";"),g=$("egrid"),F=$("filters");
const TAGS=["todos","playa","romantico","tranquilo","aventura","familia","cultura","gastronomia"],LAB={romantico:"romántico",gastronomia:"gastronomía"};
F.innerHTML=TAGS.map((t,i)=>`<button data-t="${t}" class="${i?"":"on"}">${LAB[t]||t}</button>`).join("");
function paint(tag){
  g.innerHTML=D.filter(d=>tag=="todos"||d.t.includes(tag)).map(d=>`<article class="ecard"><div class="eim" data-w="${esc(d.k)}"><span>📍</span><b>Desde $${d.c.toLocaleString("es-MX")}/día</b></div><div class="ebd"><h4>${esc(d.n)}</h4><div class="tg">${d.t.split(" ").map(t=>`<span>${esc(LAB[t]||t)}</span>`).join("")}</div><p>${esc(d.d)}</p><a class="btn" href="index.html?reservar=${d.id}"><i data-lucide="calendar-check"></i> Reservar</a></div></article>`).join("");
  window.lucide?.createIcons();
  g.querySelectorAll(".eim").forEach(async el=>{try{const j=await(await fetch("https://es.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(el.dataset.w))).json(),u=j.thumbnail?.source;if(u){const i=new Image();i.alt="";i.onload=()=>{el.querySelector("span")?.remove();el.prepend(i)};i.src=u}}catch{}});
}
F.onclick=e=>{const b=e.target.closest("button");if(!b)return;F.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x==b));paint(b.dataset.t)};
paint("todos");
</script>
</body>
</html>
